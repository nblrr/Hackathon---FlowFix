; Loaded by artisan serve (via -c flag) or start-demo.ps1.
; Match the application upload limit (10 MiB per-file) and AI run timeout.
upload_max_filesize=10M
post_max_size=12M
max_execution_time=300
max_input_time=300
default_socket_timeout=300
memory_limit=256M
display_errors=Off
display_startup_errors=Off
log_errors=On
